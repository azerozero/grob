name: Memory and crash recovery

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      memlock_mib:
        description: Finite memlock limit in MiB (64-1024)
        default: '512'
        type: string

permissions:
  contents: read

jobs:
  container:
    name: Container crash recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build production scratch image from this commit
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: Containerfile
          load: true
          tags: grob:crash-test
          cache-from: type=gha,scope=container-hardening
          cache-to: type=gha,mode=max,scope=container-hardening
      - name: Kill and recreate containers on the same volume
        run: |
          python3 scripts/ci/container-recovery.py --engine docker \
            --image grob:crash-test --output "$RUNNER_TEMP/container-recovery"
      - name: Preserve container recovery evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/container-recovery/
          if-no-files-found: warn
          retention-days: 30

  qualify:
    name: Linux memory and VM recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: hardening-linux
          save-if: ${{ github.ref == 'refs/heads/main' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-on-failure: true
      - name: Build production binary and guest probe
        id: build
        run: |
          cargo build --locked --release
          cargo test --locked --lib --no-run --message-format=json > "$RUNNER_TEMP/probes.jsonl"
          probe=$(jq -r 'select(.reason == "compiler-artifact" and .profile.test and .target.name == "grob" and .executable != null) | .executable' "$RUNNER_TEMP/probes.jsonl")
          test -f "$probe"
          echo "GROB_VM_PROBE=$probe" >> "$GITHUB_ENV"
      - name: Verify memory locking under HTTP load
        env:
          MEMLOCK_MIB: ${{ inputs.memlock_mib || '512' }}
        run: |
          mkdir -p "$RUNNER_TEMP/hardening/memory" "$RUNNER_TEMP/hardening/recovery"
          sudo python3 scripts/ci/locked-memory.py \
            --binary target/release/grob --uid "$(id -u)" --gid "$(id -g)" \
            --memlock-mib "$MEMLOCK_MIB" --output "$RUNNER_TEMP/hardening/memory"
      - name: Qualify local credentials and OpenBao outage recovery
        run: |
          for version in 2.5.5 2.7.0; do
            python3 scripts/ci/credential-recovery.py --binary target/release/grob \
              --vault-image "ghcr.io/openbao/openbao:$version" --engine docker \
              --output "$RUNNER_TEMP/hardening/credentials/$version"
          done
      - name: Verify pinned TLS and HTTP2 credential connection reuse
        run: cargo test --locked --lib --features tls credentials::transport::tls_tests
      - name: Install disposable guest tools
        id: guest_tools
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 linux-image-virtual busybox-static cpio kmod zstd
          kernel=$(printf '%s\n' /boot/vmlinuz-*-generic | sort -V | tail -1)
          destination="$RUNNER_TEMP/$(basename "$kernel")"
          sudo cp "$kernel" "$destination"
          sudo chmod 644 "$destination"
          echo "GROB_VM_KERNEL=$destination" >> "$GITHUB_ENV"
      - name: Cut VM power at storage boundaries and verify recovery
        if: ${{ !cancelled() && steps.guest_tools.outcome == 'success' }}
        run: |
          python3 scripts/ci/crash-vm.py --probe "$GROB_VM_PROBE" \
            --kernel "$GROB_VM_KERNEL" --output "$RUNNER_TEMP/hardening/recovery"
      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hardening-${{ github.sha }}
          path: ${{ runner.temp }}/hardening/
          if-no-files-found: warn
          retention-days: 30
