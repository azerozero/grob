name: Renovate

on:
  schedule:
    # Run hourly so approved updates and completed checks do not wait a week.
    # renovate.json still controls the window for creating update branches.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze updates without creating branches, issues, or PRs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Keep live scans off until credentials and the hosted-App cutover are verified.
    if: >-
      github.repository == 'azerozero/grob'
      && github.ref == 'refs/heads/main'
      && (vars.RENOVATE_ENABLED == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    # Installation tokens expire after one hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Create repository-scoped token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: azerozero
          repositories: grob

      - name: Enable dry run when requested
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f # v46.3.3
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.108.2
        env:
          # Use the read-only workflow token for public dependency changelogs.
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: info
