# cargo-deny configuration for Grob (Apache-2.0)
# https://embarkstudios.github.io/cargo-deny/

# ── Advisories ───────────────────────────────────────────────────────────────
# Checks crates against the RustSec advisory database for known vulnerabilities.
[advisories]
version = 2
# Fail CI on any known vulnerability. Keep this list minimal: prefer moving off
# an affected crate over adding an entry; an ignore is a standing decision that
# nobody re-reads. Re-review every entry and drop it the moment an upgrade path
# exists.
# Review date: 2026-10-27.
ignore = [
    # RUSTSEC-2026-0387 (crypto-bigint timing variability). The fixed 0.7.x line
    # is taken above (0.7.10). A second crypto-bigint 0.5.5 is still pulled
    # unconditionally by age 0.12.1 (the latest release) through its non-optional
    # hpke/p256 0.13 -> elliptic-curve 0.13.8 deps; 0.5.x has no patched release
    # and no grob feature toggles that path off, so the advisory cannot be
    # cleared without dropping age. cargo-deny cannot scope an advisory id to one
    # crate version, so the id is ignored globally; this is harmless because the
    # only other match (0.7.x) is already non-vulnerable. Remove this entry when
    # age ships a release built on a fixed crypto-bigint.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 pulled only by age 0.12.1; no fixed 0.5.x and no upgrade path we control" },
]
# Flag unmaintained crates only when we depend on them directly. Transitive
# ones (e.g. basic-toml via age's i18n) have no upgrade path we control;
# vulnerabilities still fail CI at any depth.
unmaintained = "workspace"

# ── Licenses ─────────────────────────────────────────────────────────────────
# Grob is Apache-2.0. We allow permissive licenses, weak-copyleft licenses that
# are acceptable for this distribution model, and a handful of special-purpose
# licenses commonly found in the Rust ecosystem.
[licenses]
version = 2
# Deny everything not explicitly listed.
allow = [
    # ── Permissive ──
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",

    # ── Public-domain-equivalent ──
    "Unlicense",
    "CC0-1.0",

    # ── Weak copyleft ──
    "MPL-2.0",

    # ── Ecosystem one-offs ──
    "CDLA-Permissive-2.0",
]
# Minimum confidence for SPDX license detection.
confidence-threshold = 0.8

# ── Bans ─────────────────────────────────────────────────────────────────────
[bans]
# Warn (don't fail) when multiple versions of the same crate are pulled in.
multiple-versions = "warn"
# Allow wildcard dependencies — common during rapid development.
wildcards = "allow"
highlight = "all"

# ── Sources ──────────────────────────────────────────────────────────────────
# Only allow crates published to crates.io. Warn on anything else.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
