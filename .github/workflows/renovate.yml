name: Renovate

on:
  schedule:
    # Run hourly so approved updates and completed checks do not wait a week.
    # renovate.json still controls the window for creating update branches.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Analyze updates without creating branches, issues, or PRs
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    # Keep live scans off until credentials and the hosted-App cutover are verified.
    if: >-
      github.repository == 'azerozero/grob'
      && github.ref == 'refs/heads/main'
      && (vars.RENOVATE_ENABLED == 'true'
          || (github.event_name == 'workflow_dispatch' && inputs.dry_run))
    runs-on: ubuntu-latest
    # Installation tokens expire after one hour.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create repository-scoped token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: azerozero
          repositories: grob

      - name: Enable dry run when requested
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: echo 'RENOVATE_DRY_RUN=full' >> "$GITHUB_ENV"

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          configurationFile: .github/renovate-config.json
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.224.1
        env:
          # Use the read-only workflow token for public dependency changelogs.
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: info
